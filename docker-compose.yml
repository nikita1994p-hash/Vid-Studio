name: vidauto

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.45.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"   # only this computer can open n8n
    environment:
      - GENERIC_TIMEZONE=${TIMEZONE}
      - TZ=${TIMEZONE}
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_WEBHOOK_URL=http://localhost:5678/
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem   # keep the mp4 on disk, not in memory
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - worker

  worker:
    build: ./worker
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"   # the dashboard: http://localhost:8000 (n8n uses http://worker:8000)
    volumes:
      - ./data:/data
      - ${SKILLS_DIR}:/skills:ro
      - ${YOUTUBE_PROFILE_DIR}:/youtube:ro

volumes:
  n8n_data:
