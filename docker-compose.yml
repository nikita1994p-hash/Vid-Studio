name: vidauto

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.45.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"   # only this computer can open n8n
    environment:
      - GENERIC_TIMEZONE=${TIMEZONE}
      - TZ=${TIMEZONE}
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_WEBHOOK_URL=http://localhost:5678/
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem   # keep the mp4 on disk, not in memory
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - worker

  worker:
    build: ./worker
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"   # the dashboard: http://localhost:8000 (n8n uses http://worker:8000)
    environment:
      - PUBLIC_PROXY_HOST=tailscale   # requests from the tunnel never reach n8n's addresses (/produce, /social/...)
    volumes:
      - ./data:/data
      - ${SKILLS_DIR}:/skills:ro
      - ${YOUTUBE_PROFILE_DIR}:/youtube:ro

  # the public https address (Tailscale Funnel): only the Studio is published, never n8n.
  # Starts only with:  docker compose --profile public up -d   (needs TS_AUTHKEY in .env)
  tailscale:
    image: tailscale/tailscale:v1.104.4
    profiles: ["public"]
    hostname: vidstudio                 # the address becomes https://vidstudio.<your-tailnet>.ts.net
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./tailscale:/config:ro
    depends_on:
      - worker

volumes:
  n8n_data:
  tailscale_state:
