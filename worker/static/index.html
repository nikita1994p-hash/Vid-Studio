<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vid Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff375f'/%3E%3Cstop offset='1' stop-color='%23ff9f0a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M16 8.6c.7 0 1.3.4 1.7 1l6 10.4c.8 1.3-.2 3-1.7 3H10c-1.5 0-2.5-1.7-1.7-3l6-10.4c.4-.6 1-1 1.7-1z' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="create-wrap">
      <button class="icon-btn" id="menu-btn" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="menu menu-left" id="user-menu" hidden>
        <div class="menu-note" id="user-email"></div>
        <a href="#/users" id="users-link" hidden>👥 Users</a>
        <a href="#/account">🔑 My account</a>
        <button data-action="logout">↪ Log out</button>
      </div>
    </div>
    <a class="brand" href="#/">
      <span class="logo"><svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg-top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff375f"/><stop offset=".55" stop-color="#ff6a3d"/><stop offset="1" stop-color="#ff9f0a"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#lg-top)"/><path d="M16 8.6c.7 0 1.3.4 1.7 1l6 10.4c.8 1.3-.2 3-1.7 3H10c-1.5 0-2.5-1.7-1.7-3l6-10.4c.4-.6 1-1 1.7-1z" fill="#fff"/></svg></span><span>Vid</span><span class="brand-sub">Studio</span>
    </a>
    <div class="topbar-spacer"></div>
    <span class="pill" id="mode-pill" title="Settings from .env">…</span>
    <div class="create-wrap">
      <button class="btn btn-outline" id="create-btn">＋ Create</button>
      <div class="menu" id="create-menu" hidden>
        <button data-action="new">🎬 New AI video</button>
        <button data-action="upload">⬆ Upload video</button>
      </div>
    </div>
  </header>

  <nav class="sidebar" id="sidebar">
    <div class="channel">
      <div class="avatar"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 5.5c1 0 1.9.5 2.4 1.4l9.3 16.1c1.1 1.9-.3 4.3-2.4 4.3H6.7c-2.1 0-3.5-2.4-2.4-4.3l9.3-16.1c.5-.9 1.4-1.4 2.4-1.4z" fill="#fff"/></svg></div>
      <select class="channel-pick" id="channel-pick" aria-label="Channel"></select>
      <div class="channel-sub" id="channel-niche"></div>
      <a class="channel-manage" href="#/channels">Manage channels</a>
    </div>
    <a href="#/" data-nav="dashboard"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg></span>Dashboard</a>
    <a href="#/content" data-nav="content"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="3"/><path d="M10.5 9.5v5l4.2-2.5z" fill="currentColor"/></svg></span>Content</a>
    <a href="#/topics" data-nav="topics"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.8" cy="6.5" r=".9" fill="currentColor"/><circle cx="4.8" cy="12" r=".9" fill="currentColor"/><circle cx="4.8" cy="17.5" r=".9" fill="currentColor"/></svg></span>Topics</a>
    <a href="#/ab" data-nav="ab"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="7" height="15" rx="2"/><rect x="13.5" y="4.5" width="7" height="15" rx="2"/><path d="M5.5 15.5l1.5-5 1.5 5M6 14h2M15.5 10.5h2a1.2 1.2 0 010 2.5h-2v-2.5zm0 2.5h2.3a1.3 1.3 0 010 2.5h-2.3V13z"/></svg></span>A/B tests</a>
    <a href="#/earnings" data-nav="earnings"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5h16"/><path d="M5 15l4.5-4.5 3.5 3 6-6.5"/><path d="M15 7h4v4"/></svg></span>Earnings</a>
    <a href="#/accounts" data-nav="accounts"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c1.2-3.7 4-5.5 7.5-5.5s6.3 1.8 7.5 5.5"/></svg></span>Accounts</a>
    <a href="#/settings" data-nav="settings"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></span>Settings</a>
    <div class="sidebar-foot">
      <a href="http://localhost:5678" target="_blank" rel="noopener"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="12" r="2.3"/><circle cx="18.5" cy="6" r="2.3"/><circle cx="18.5" cy="18" r="2.3"/><path d="M7.8 12h3.2l5.2-5M11 12l5.2 5"/></svg></span>Open n8n</a>
    </div>
  </nav>

  <main id="view"></main>

  <dialog id="new-dialog">
    <form method="dialog" id="new-form">
      <h2>New AI video</h2>
      <label>Topic <span class="muted">(leave empty: the next one from Topics, or the AI picks one)</span>
        <input name="topic" placeholder="e.g. Why the Golden Gate Bridge is orange" maxlength="200">
      </label>
      <p class="muted" id="next-part-hint" hidden></p>
      <details>
        <summary>✍ Write my own script</summary>
        <label><span class="muted">First line = the hook, then one line per scene. The AI only adds pictures,
          on-screen numbers, the loop line and the title.</span>
          <textarea name="script" rows="7" placeholder="This boring machine makes $2,000 a month.&#10;A used ice vending machine costs about twelve thousand dollars.&#10;…"></textarea>
        </label>
      </details>
      <label>Versions to make <span class="muted">(A/B test: each gets its own hook, title, voice, music and pictures)</span>
        <select name="variants">
          <option value="1">1 — just one video</option><option value="2">2 versions</option>
          <option value="3">3 versions</option><option value="4">4 versions</option><option value="5">5 versions</option>
        </select>
      </label>
      <details>
        <summary>⚙ Options for this video <span class="muted">(empty = as in Settings)</span></summary>
        <div class="opt-grid" id="new-options"></div>
      </details>
      <label class="check"><input type="checkbox" name="mock"> Test mode — free, no Gemini (test pattern images, real voice)</label>
      <label class="check"><input type="checkbox" name="video"> Live video hook in the first seconds (≈ +$0.80)</label>
      <div class="dialog-actions">
        <button value="cancel" class="btn btn-text" formnovalidate>Cancel</button>
        <button value="ok" class="btn btn-primary">Create</button>
      </div>
    </form>
  </dialog>

  <dialog id="upload-dialog">
    <form method="dialog" id="upload-form">
      <h2>Upload video</h2>
      <label class="drop" id="drop">
        <input type="file" name="file" accept="video/*" required>
        <span id="drop-text">Drag a video here or click to choose (.mp4, .mov, .webm)</span>
      </label>
      <label>Title (required)<input name="title" required maxlength="100"></label>
      <label>Description<textarea name="description" rows="3"></textarea></label>
      <label>Tags <span class="muted">(comma separated)</span><input name="tags"></label>
      <progress id="upload-progress" max="100" value="0" hidden></progress>
      <div class="dialog-actions">
        <button value="cancel" class="btn btn-text" formnovalidate>Cancel</button>
        <button value="ok" class="btn btn-primary">Upload</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
