<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Vid Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff375f'/%3E%3Cstop offset='1' stop-color='%23ff9f0a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M16 8.6c.7 0 1.3.4 1.7 1l6 10.4c.8 1.3-.2 3-1.7 3H10c-1.5 0-2.5-1.7-1.7-3l6-10.4c.4-.6 1-1 1.7-1z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand auth-brand"><span class="logo"><svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg-auth" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff375f"/><stop offset=".55" stop-color="#ff6a3d"/><stop offset="1" stop-color="#ff9f0a"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#lg-auth)"/><path d="M16 8.6c.7 0 1.3.4 1.7 1l6 10.4c.8 1.3-.2 3-1.7 3H10c-1.5 0-2.5-1.7-1.7-3l6-10.4c.4-.6 1-1 1.7-1z" fill="#fff"/></svg></span><span>Vid</span><span class="brand-sub">Studio</span></div>
    <div class="tabs auth-tabs">
      <button class="tab active" data-mode="login" type="button">Sign in</button>
      <button class="tab" data-mode="register" type="button">Create account</button>
    </div>
    <div class="ok-box" id="invite-hint" hidden></div>
    <p class="muted" id="first-hint" hidden>No accounts yet: the first one you create owns this Studio and
      takes over the channel that is already here.</p>
    <p class="muted" id="mode-hint" hidden></p>
    <form id="auth-form">
      <label id="email-row">E-mail<input name="email" type="email" autocomplete="email" required maxlength="200"></label>
      <label id="password-row"><span id="pw-label">Password</span> <span class="muted" id="pw-hint" hidden>(at least 8 characters, not easy to guess)</span>
        <input name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="200">
      </label>
      <label id="repeat-row" hidden>Repeat the new password
        <input name="repeat" type="password" autocomplete="new-password" minlength="8" maxlength="200"></label>
      <label id="code-row" hidden>Code from your authenticator app
        <input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="12" placeholder="123 456"
          style="font-size:22px;letter-spacing:4px;text-align:center"></label>
      <div id="register-only" hidden>
        <label class="check"><input type="checkbox" name="adult">
          <span>I am 18 or older and agree to the
          <a href="https://nikita1994p-hash.github.io/Vid-Studio/terms.html" target="_blank" rel="noopener">Terms</a> and the
          <a href="https://nikita1994p-hash.github.io/Vid-Studio/privacy.html" target="_blank" rel="noopener">Privacy Policy</a></span></label>
        <label class="check"><input type="checkbox" name="marketing">
          Send me news, tips and offers about Vid Studio by e-mail (optional, unsubscribe any time)</label>
      </div>
      <div class="error-box" id="auth-error" hidden></div>
      <div class="ok-box" id="auth-ok" hidden></div>
      <button class="btn btn-primary auth-submit" id="auth-submit">Sign in</button>
    </form>
    <p class="muted small auth-foot"><a href="#" id="forgot-link">Forgot password?</a>
      <a href="#" id="back-link" hidden>← Back to sign in</a> · <a href="/pricing">Plans &amp; pricing</a></p>
  </main>
  <script>
    const form = document.getElementById("auth-form");
    let mode = "login";

    // login | register | code (two-step) | forgot (ask for a link) | reset (new password from the link)
    let ticket = "";
    const RESET = new URLSearchParams(location.search).get("reset") || "";
    if (RESET) history.replaceState(null, "", "/login");   // the one-time link does not stay in the address bar
    const show = (id, on) => { document.getElementById(id).hidden = !on; };
    const TITLE = { login: "Sign in", register: "Create account", code: "Confirm", forgot: "Send me a reset link", reset: "Set the new password" };

    function setMode(m, hint = "") {
      mode = m;
      document.querySelectorAll(".auth-tabs .tab").forEach((b) => b.classList.toggle("active", b.dataset.mode === m));
      show("register-only", m === "register");
      show("pw-hint", m === "register" || m === "reset");
      show("email-row", ["login", "register", "forgot"].includes(m));
      show("password-row", ["login", "register", "reset"].includes(m));
      show("repeat-row", m === "reset");
      show("code-row", m === "code");
      show("forgot-link", m === "login");
      show("back-link", ["code", "forgot", "reset"].includes(m));
      document.querySelector(".auth-tabs").hidden = ["code", "forgot", "reset"].includes(m);
      document.getElementById("pw-label").textContent = m === "reset" ? "New password" : "Password";
      form.email.required = ["login", "register", "forgot"].includes(m);
      form.password.required = ["login", "register", "reset"].includes(m);
      form.repeat.required = m === "reset";
      form.code.required = m === "code";
      form.adult.required = m === "register";   // the browser stops the form until it is ticked
      document.getElementById("auth-submit").textContent = TITLE[m];
      form.password.autocomplete = m === "login" ? "current-password" : "new-password";
      const h = document.getElementById("mode-hint");
      h.textContent = hint;
      h.hidden = !hint;
      document.getElementById("auth-error").hidden = true;
      document.getElementById("auth-ok").hidden = true;
      if (m === "code") form.code.focus();
    }

    document.getElementById("forgot-link").addEventListener("click", (e) => {
      e.preventDefault();
      setMode("forgot", "Enter the e-mail address associated with your account and we will send you a link to reset your password.");
    });
    document.getElementById("back-link").addEventListener("click", (e) => { e.preventDefault(); ticket = ""; setMode("login"); });

    document.querySelectorAll(".auth-tabs .tab").forEach((b) => b.addEventListener("click", () => setMode(b.dataset.mode)));

    // where this visitor came from: ?ref= / utm_* of the link and the referring site, kept for this tab
    // so it survives switching between Sign in and Create account
    const SOURCE = (() => {
      let saved = {};
      try { saved = JSON.parse(sessionStorage.getItem("vs_source") || "{}"); } catch (e) { /* private mode */ }
      const q = new URLSearchParams(location.search);
      const found = {};
      for (const k of ["ref", "utm_source", "utm_medium", "utm_campaign"]) if (q.get(k)) found[k] = q.get(k).slice(0, 100);
      if (q.get("plan")) found.wanted_plan = q.get("plan").slice(0, 20);   // the plan they picked on the plans page
      if (document.referrer && !document.referrer.startsWith(location.origin)) found.referrer = document.referrer.slice(0, 300);
      if (location.search) found.landing = (location.pathname + location.search).slice(0, 300);
      const source = Object.keys(found).length ? found : saved;
      try { sessionStorage.setItem("vs_source", JSON.stringify(source)); } catch (e) { /* private mode */ }
      return source;
    })();
    const LOCALE = { timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || null, language: navigator.language || null };
    if (/[?&](ref|utm_source|invite|plan)=/.test(location.search)) setMode("register");

    // an invite link (?invite=CODE) gives a plan to the account made with it
    const INVITE = new URLSearchParams(location.search).get("invite") || "";
    let inviteOk = false;   // a dead invite must not block the sign-up itself
    if (INVITE) {
      fetch(`/api/auth/invite/${encodeURIComponent(INVITE)}`).then(async (r) => {
        const box = document.getElementById("invite-hint");
        const d = await r.json().catch(() => ({}));
        inviteOk = r.ok;
        box.textContent = r.ok ? `🎁 You are invited: your account starts with the ${d.label} plan.`
          : "This invite link has expired or was already used - you can still create an account.";
        box.className = r.ok ? "ok-box" : "ok-box warn-box";
        box.hidden = false;
      });
    }

    if (RESET) {
      fetch(`/api/auth/reset/${encodeURIComponent(RESET)}`).then(async (r) => {
        const d = await r.json().catch(() => ({}));
        if (r.ok) setMode("reset", `Please choose a new password for ${d.email}. For your security, you will be signed out on all devices.`);
        else { setMode("forgot"); const b = document.getElementById("auth-error"); b.textContent = "This reset link has expired or has already been used. Please request a new one below."; b.hidden = false; }
      });
    } else {
      fetch("/api/auth/state").then((r) => r.json()).then((s) => {
        if (s.signed_in) location.href = "/";
        if (s.first_account) { document.getElementById("first-hint").hidden = false; setMode("register"); }
      }).catch(() => {});
    }

    const post = async (path, body) => {
      const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : "Something went wrong - try again");
      return data;
    };

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const box = document.getElementById("auth-error");
      const ok = document.getElementById("auth-ok");
      const btn = document.getElementById("auth-submit");
      box.hidden = true;
      btn.disabled = true;
      try {
        if (mode === "forgot") {
          const d = await post("/api/auth/reset", { email: form.email.value });
          ok.textContent = `Thank you. If an account is registered with ${form.email.value}, we have sent an e-mail with `
            + `instructions to reset your password. For your security, the link can be used only once and expires in ${d.minutes} minutes. `
            + "If you do not receive the e-mail within a few minutes, please check your spam or junk folder.";
          ok.hidden = false;
        } else if (mode === "reset") {
          if (form.password.value !== form.repeat.value) throw new Error("the two passwords are not the same");
          const d = await post("/api/auth/reset/finish", { token: RESET, password: form.password.value });
          form.password.value = form.repeat.value = "";
          setMode("login", "Your password has been changed successfully. Please sign in with your new password"
            + (d.two_step ? " and the code from your authenticator app." : "."));
        } else if (mode === "code") {
          await post("/api/auth/login/code", { ticket, code: form.code.value, ...LOCALE });
          location.href = "/";
        } else {
          const body = { email: form.email.value, password: form.password.value, ...LOCALE };
          if (mode === "register") Object.assign(body, { adult: form.adult.checked, marketing: form.marketing.checked, source: SOURCE, invite: inviteOk ? INVITE : null });
          const d = await post(`/api/auth/${mode}`, body);
          if (d.two_step) {
            ticket = d.ticket;
            form.code.value = "";
            setMode("code", "Open Google Authenticator (or another authenticator app) and type the 6-digit code for Vid Studio. "
              + "Lost the phone? Type one of your backup codes instead.");
          } else location.href = "/";
        }
      } catch (err) {
        box.textContent = err.message;
        box.hidden = false;
        if (/took too long/.test(err.message)) setMode("login");
      }
      btn.disabled = false;
    });
  </script>
</body>
</html>
